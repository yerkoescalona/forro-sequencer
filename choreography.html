<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forró Choreography — Movement Sequencer</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e3e;
      --text: #e8e8f0;
      --text-dim: #7878a0;
      --basic: #4fc3f7;
      --transparente: #81c784;
      --azul: #ce93d8;
      --phase-on1: #ffb74d;
      --phase-on3: #f06292;
      --flip: #ff5252;
      --accent: #7c4dff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: .04em; }
    header a { color: var(--text-dim); font-size: 13px; text-decoration: none; }
    header a:hover { color: var(--text); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: auto auto;
      gap: 1px;
      background: var(--border);
      height: calc(100vh - 53px);
    }

    .panel {
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Graph ── */
    #graph-panel { grid-row: 1 / 3; }
    #graph-svg { flex: 1; width: 100%; }

    .node circle {
      stroke-width: 1.5px;
      cursor: pointer;
      transition: r 0.15s;
    }
    .node circle:hover { filter: brightness(1.3); }
    .node text {
      font-size: 11px;
      fill: var(--text);
      pointer-events: none;
      text-anchor: middle;
    }
    .node.dimmed circle { opacity: 0.18; }
    .node.dimmed text { opacity: 0.18; }
    .node.selected circle { stroke: white; stroke-width: 2.5px; }

    .link {
      stroke: var(--border);
      stroke-opacity: 0.6;
      stroke-width: 1.2px;
      fill: none;
      marker-end: url(#arrow);
    }
    .link.highlighted { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2px; }
    .link.dimmed { opacity: 0.08; }

    /* ── Right panels ── */
    #sequencer-panel { grid-column: 2; grid-row: 1; }
    #info-panel      { grid-column: 2; grid-row: 2; }

    /* ── Controls ── */
    .controls {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    label { font-size: 12px; color: var(--text-dim); min-width: 52px; }

    select, input[type=range] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 13px;
    }
    select:focus { outline: 1px solid var(--accent); }

    input[type=range] { padding: 0; cursor: pointer; accent-color: var(--accent); }

    .btn {
      padding: 5px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn:hover { background: var(--surface); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { background: #9c6fff; }

    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .chip.basic        { background: #0d3d52; color: var(--basic); }
    .chip.transparente { background: #1a3d1c; color: var(--transparente); }
    .chip.azul         { background: #3d2352; color: var(--azul); }

    /* ── Sequence timeline ── */
    #timeline {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }

    .seq-empty {
      color: var(--text-dim);
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
    }

    .seq-meta {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .beat-track {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
      align-items: flex-end;
    }

    .beat-block {
      height: 44px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 3px;
      text-align: center;
      line-height: 1.2;
      position: relative;
      cursor: default;
      transition: filter 0.15s;
      overflow: hidden;
    }
    .beat-block:hover { filter: brightness(1.2); }
    .beat-block .move-name {
      font-size: 9px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .beat-block .beat-count {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.9;
    }
    .beat-block .flip-badge {
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: 9px;
    }

    .phase-on1 { background: #3d2a05; border: 1px solid var(--phase-on1); color: var(--phase-on1); }
    .phase-on3 { background: #3d0a1a; border: 1px solid var(--phase-on3); color: var(--phase-on3); }

    .phase-ruler {
      display: flex;
      gap: 2px;
      margin-bottom: 4px;
    }
    .phase-tick {
      font-size: 9px;
      text-align: center;
      color: var(--text-dim);
      padding-top: 2px;
    }

    .seq-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .seq-step:last-child { border-bottom: none; }
    .step-num { color: var(--text-dim); min-width: 18px; }
    .step-name { flex: 1; }
    .step-beats { color: var(--text-dim); font-size: 11px; }
    .step-pos { font-size: 10px; color: var(--text-dim); }
    .step-flip { color: var(--flip); font-size: 10px; }

    /* ── Info panel ── */
    #info-panel { min-height: 180px; }
    #info-content {
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.6;
      overflow-y: auto;
      flex: 1;
    }
    #info-content .info-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    #info-content .info-row  { margin-bottom: 4px; color: var(--text-dim); }
    #info-content .info-row span { color: var(--text); }
    #info-content .info-notes { margin-top: 8px; color: var(--text-dim); font-style: italic; }
    #info-content .unlocks { margin-top: 10px; }
    #info-content .unlocks-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

    .legend {
      display: flex;
      gap: 14px;
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<header>
  <h1>Forró Movement Sequencer</h1>
  <a href="index.html">← Rhythm</a>
</header>

<div class="layout">

  <!-- Left: dependency graph -->
  <div class="panel" id="graph-panel">
    <div class="panel-header">
      Movement Graph
      <span style="font-size:11px;font-weight:400">Click a node to inspect · Drag to explore</span>
    </div>
    <svg id="graph-svg">
      <defs>
        <marker id="arrow" markerWidth="6" markerHeight="6"
                refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#2e2e3e"/>
        </marker>
      </defs>
    </svg>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--basic)"></div>basic</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--transparente)"></div>transparente</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--azul)"></div>azul</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--flip);opacity:.7"></div>phase-flip (3 or 5 steps)</div>
    </div>
  </div>

  <!-- Right top: sequencer controls + timeline -->
  <div class="panel" id="sequencer-panel">
    <div class="panel-header">Sequence Generator</div>
    <div class="controls">
      <div class="control-row">
        <label>Level</label>
        <select id="sel-level">
          <option value="basic">basic</option>
          <option value="transparente" selected>transparente</option>
          <option value="azul">azul</option>
        </select>
        <label>Phrase</label>
        <select id="sel-phrase">
          <option value="15">15b (7½ bars)</option>
          <option value="16" selected>16b (8 bars)</option>
          <option value="32">32b (16 bars)</option>
        </select>
      </div>
      <div class="control-row">
        <label>Start</label>
        <select id="sel-phase">
          <option value="on1">on1</option>
          <option value="on3">on3</option>
        </select>
        <label>Goal</label>
        <select id="sel-goal">
          <option value="same">same phase</option>
          <option value="on1">resolve → on1</option>
          <option value="on3">resolve → on3</option>
        </select>
      </div>
      <div class="control-row">
        <button class="btn primary" id="btn-generate">Generate</button>
        <span id="gen-msg" style="font-size:12px;color:var(--text-dim)"></span>
      </div>
    </div>
    <div id="timeline"><div class="seq-empty">Click Generate to build a sequence.</div></div>
  </div>

  <!-- Right bottom: node info -->
  <div class="panel" id="info-panel">
    <div class="panel-header">Move Details</div>
    <div id="info-content">
      <div class="seq-empty">Click a move in the graph.</div>
    </div>
  </div>

</div>

<script>
// ── Data + state machine ─────────────────────────────────────────────────────

const LEVELS = ['basic', 'transparente', 'azul'];
const LEVEL_COLOR = {
  basic: getComputedStyle(document.documentElement).getPropertyValue('--basic').trim(),
  transparente: getComputedStyle(document.documentElement).getPropertyValue('--transparente').trim(),
  azul: getComputedStyle(document.documentElement).getPropertyValue('--azul').trim(),
};
const FLIP_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--flip').trim();

let MOVES = [];
let moveMap = {};

async function loadMoves() {
  const r = await fetch('moves.json');
  MOVES = await r.json();
  moveMap = Object.fromEntries(MOVES.map(m => [m.name, m]));
}

// ── State machine ─────────────────────────────────────────────────────────

function advanceState(state, move, phraseLen) {
  const newBeat = (state.beat + move.beats) % phraseLen;
  const newPhase = (move.phase_shift % 2 === 1)
    ? (state.phase === 'on1' ? 'on3' : 'on1')
    : state.phase;
  const newEmbrace = move.exit || state.embrace;
  return { beat: newBeat, phase: newPhase, embrace: newEmbrace };
}

function expandLevel(level, moves) {
  const cutoff = LEVELS.indexOf(level);
  return moves.filter(m => LEVELS.indexOf(m.level) <= cutoff);
}

function prereqsMet(move, knownNames) {
  return move.requires.every(r => knownNames.has(r));
}

function availableFrom(known, moves) {
  const knownNames = new Set(known.map(m => m.name));
  return moves.filter(m => knownNames.has(m.name) || prereqsMet(m, knownNames));
}

function findSequence(startState, available, phraseLen, goalPhase, maxDepth = 24) {
  const avail = available.filter(m => m.beats != null);
  let result = null;

  function dfs(state, path, spent) {
    if (result) return;
    const remaining = phraseLen - spent;
    if (remaining === 0) {
      if (state.beat === startState.beat && state.phase === goalPhase) {
        result = [...path];
      }
      return;
    }
    if (spent > phraseLen || path.length >= maxDepth) return;

    // shuffle for variety
    const candidates = avail
      .filter(m => {
        if (m.beats > remaining) return false;
        if (m.entry && m.entry !== state.embrace) return false;
        return true;
      })
      .sort(() => Math.random() - 0.5);

    for (const move of candidates) {
      path.push(move);
      dfs(advanceState(state, move, phraseLen), path, spent + move.beats);
      if (result) return;
      path.pop();
    }
  }

  dfs(startState, [], 0);
  return result;
}

// ── Sequence UI ──────────────────────────────────────────────────────────────

function phaseClass(p) { return p === 'on1' ? 'phase-on1' : 'phase-on3'; }

function renderTimeline(seq, startState, phraseLen) {
  const el = document.getElementById('timeline');
  if (!seq || seq.length === 0) {
    el.innerHTML = '<div class="seq-empty">No sequence found — try a longer phrase or higher level.</div>';
    return;
  }

  const totalBeats = seq.reduce((s, m) => s + m.beats, 0);
  const pixPerBeat = Math.max(18, Math.floor((el.clientWidth - 28) / phraseLen));

  let html = `<div class="seq-meta">
    ${seq.length} moves · ${totalBeats}/${phraseLen} beats ·
    start: <b>${startState.phase}</b> [${startState.embrace}]
  </div>`;

  // Phase ruler
  html += '<div class="phase-ruler">';
  html += `<div class="phase-tick" style="width:${pixPerBeat * 0}px"></div>`;
  let state = startState;
  for (const m of seq) {
    const w = pixPerBeat * m.beats;
    html += `<div class="phase-tick ${phaseClass(state.phase)}" style="width:${w}px;min-width:${w}px">${state.beat}</div>`;
    state = advanceState(state, m, phraseLen);
  }
  html += '</div>';

  // Beat blocks
  html += '<div class="beat-track">';
  state = startState;
  for (const m of seq) {
    const w = Math.max(30, pixPerBeat * m.beats);
    const flipBadge = m.phase_shift % 2 === 1 ? '<div class="flip-badge">⚡</div>' : '';
    html += `<div class="beat-block ${phaseClass(state.phase)}" style="width:${w}px;min-width:${w}px"
      title="${m.name}&#10;${m.beats} beats · ${state.phase} · ${state.embrace} → ${m.exit || state.embrace}">
      ${flipBadge}
      <div class="move-name">${m.name}</div>
      <div class="beat-count">${m.beats}b</div>
    </div>`;
    state = advanceState(state, m, phraseLen);
  }
  html += '</div>';

  // Step list
  state = startState;
  let i = 1;
  for (const m of seq) {
    const next = advanceState(state, m, phraseLen);
    const flip = m.phase_shift % 2 === 1
      ? `<span class="step-flip">⚡ ${state.phase}→${next.phase}</span>` : '';
    const posChange = m.entry !== m.exit && m.exit
      ? `${m.entry || '?'} → ${m.exit}` : (m.entry || '?');
    html += `<div class="seq-step">
      <div class="step-num">${i++}.</div>
      <div class="step-name">${m.name} ${flip}</div>
      <div class="step-beats">${m.beats}b</div>
      <div class="step-pos">[${posChange}]</div>
    </div>`;
    state = next;
  }

  el.innerHTML = html;
}

function onGenerate() {
  const level    = document.getElementById('sel-level').value;
  const phraseLen = +document.getElementById('sel-phrase').value;
  const startPhase = document.getElementById('sel-phase').value;
  const goalSel  = document.getElementById('sel-goal').value;
  const msg      = document.getElementById('gen-msg');

  const startEmbrace = 'closed';
  const startState   = { beat: startPhase === 'on3' ? Math.floor(phraseLen / 2) : 0, phase: startPhase, embrace: startEmbrace };
  const goalPhase    = goalSel === 'same' ? startPhase : goalSel;

  // Feasibility: different phase requires odd # of odd-beat moves → phrase must be odd
  if (goalPhase !== startPhase && phraseLen % 2 === 0) {
    msg.textContent = `✗ ${startPhase}→${goalPhase} impossible in ${phraseLen}b phrase. Try 15b.`;
    document.getElementById('timeline').innerHTML =
      '<div class="seq-empty">Phase change is mathematically impossible in an even-length phrase.<br>Use the 15-beat (7½ bar) phrase instead.</div>';
    return;
  }

  msg.textContent = 'searching…';
  const levelMoves = expandLevel(level, MOVES);
  const available  = availableFrom(levelMoves, MOVES);

  setTimeout(() => {
    const seq = findSequence(startState, available, phraseLen, goalPhase);
    msg.textContent = seq ? `${seq.length} moves found` : 'no path found';
    renderTimeline(seq, startState, phraseLen);
  }, 10);
}

// ── Graph (D3) ───────────────────────────────────────────────────────────────

let simulation, selectedNode = null;

function nodeColor(m) {
  return LEVEL_COLOR[m.level] || '#888';
}

function nodeRadius(m) {
  if (!m.beats) return 10;
  return 7 + m.beats * 1.2;
}

function renderGraph(moves) {
  const svg  = d3.select('#graph-svg');
  const rect = document.getElementById('graph-svg').getBoundingClientRect();
  const W    = rect.width;
  const H    = rect.height;

  svg.selectAll('*').remove();
  svg.attr('viewBox', `0 0 ${W} ${H}`);

  const nodes = moves.map(m => ({ ...m, id: m.name }));
  const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

  const links = [];
  for (const m of moves) {
    for (const req of m.requires) {
      if (nodeById[req]) {
        links.push({ source: req, target: m.name });
      }
    }
  }

  const g = svg.append('g');

  svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', e => g.attr('transform', e.transform)));

  // Arrow marker (per-level colors would need multiple, use generic)
  svg.select('defs').remove();
  svg.append('defs').append('marker')
    .attr('id', 'arrow').attr('markerWidth', 7).attr('markerHeight', 7)
    .attr('refX', 12).attr('refY', 3.5).attr('orient', 'auto')
    .append('path').attr('d', 'M0,0 L7,3.5 L0,7 Z').attr('fill', '#2e2e3e');

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(90).strength(0.6))
    .force('charge', d3.forceManyBody().strength(-220))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 12));

  const link = g.append('g').selectAll('line')
    .data(links).join('line')
    .attr('class', 'link');

  const node = g.append('g').selectAll('g')
    .data(nodes).join('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on('click', (e, d) => { e.stopPropagation(); selectNode(d, node, link); });

  node.append('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => d.phase_shift % 2 === 1 ? `${FLIP_COLOR}33` : `${nodeColor(d)}22`)
    .attr('stroke', d => d.phase_shift % 2 === 1 ? FLIP_COLOR : nodeColor(d));

  node.append('text')
    .attr('dy', d => nodeRadius(d) + 12)
    .text(d => d.name)
    .style('font-size', '10px')
    .style('fill', d => nodeColor(d));

  svg.on('click', () => {
    selectedNode = null;
    node.classed('dimmed', false).classed('selected', false);
    link.classed('highlighted', false).classed('dimmed', false);
    document.getElementById('info-content').innerHTML = '<div class="seq-empty">Click a move in the graph.</div>';
  });

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  return { node, link, nodes };
}

function selectNode(d, node, link) {
  selectedNode = d;
  const requires = new Set(d.requires);
  const unlocks  = MOVES.filter(m => m.requires.includes(d.name)).map(m => m.name);

  node.classed('dimmed', n => n.id !== d.id && !requires.has(n.id) && !unlocks.includes(n.id))
      .classed('selected', n => n.id === d.id);

  link.classed('highlighted', l => l.target.id === d.id || l.source.id === d.id)
      .classed('dimmed',      l => l.target.id !== d.id && l.source.id !== d.id);

  const levelChip = `<span class="chip ${d.level}">${d.level}</span>`;
  const beats     = d.beats != null ? `${d.beats}b` : '?';
  const phaseFlip = d.phase_shift % 2 === 1 ? ' <span style="color:var(--flip)">⚡ phase-flip</span>' : '';
  const pos       = d.entry ? `${d.entry} → ${d.exit || d.entry}` : '?';
  const reqList   = d.requires.length
    ? d.requires.map(r => `<span class="chip ${moveMap[r]?.level || ''}" style="cursor:pointer">${r}</span>`).join(' ')
    : '<em>none (root)</em>';
  const unlockList = unlocks.length
    ? unlocks.map(u => `<span class="chip ${moveMap[u]?.level || ''}">${u}</span>`).join(' ')
    : '<em>none yet</em>';

  document.getElementById('info-content').innerHTML = `
    <div class="info-name">${d.name} ${levelChip}</div>
    <div class="info-row">Beats: <span>${beats}${phaseFlip}</span></div>
    <div class="info-row">Position: <span>${pos}</span></div>
    <div class="info-row">Requires: <span>${reqList}</span></div>
    <div class="unlocks">
      <div class="info-row">Unlocks:</div>
      <div class="unlocks-list">${unlockList}</div>
    </div>
    ${d.notes ? `<div class="info-notes">${d.notes}</div>` : ''}
  `;
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  await loadMoves();

  let graphRefs = renderGraph(MOVES);
  window.addEventListener('resize', () => { graphRefs = renderGraph(MOVES); });

  document.getElementById('btn-generate').addEventListener('click', onGenerate);
}

init();
</script>
